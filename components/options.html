<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Sudoku Enhanced - Shortcuts</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <h1>Keyboard Shortcuts</h1>
    <p class="options-description">Click "Change" then press a key to rebind. Changes apply after saving.</p>
    <table>
        <thead>
            <tr>
                <th>Action</th>
                <th>Key</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="shortcutTable"></tbody>
    </table>
    <div class="options-conflict-message" id="conflictWarning">This key is already assigned to another action.</div>
    <div class="options-button-group">
        <button class="options-reset-button" id="resetBtn">Reset to Defaults</button>
        <button class="options-save-button" id="saveBtn">Save</button>
    </div>
    <script src="options.js"></script>
</body>
</html>
