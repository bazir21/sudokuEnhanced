<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 260px;
            padding: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
        }
        h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .toggle-row label {
            font-size: 13px;
        }
        .toggle {
            position: relative;
            width: 36px;
            height: 20px;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            border-radius: 20px;
            transition: 0.2s;
        }
        .slider:before {
            content: "";
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        input:checked + .slider {
            background-color: #533483;
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }
        .options-link {
            display: block;
            text-align: center;
            margin-top: 12px;
            padding: 8px;
            background: #533483;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        .options-link:hover {
            background-color: #6a42a0;
        }
    </style>
</head>
<body>
    <h3>Sudoku Enhanced</h3>
    <div class="toggle-row">
        <label for="darkToggle">Dark Mode</label>
        <label class="toggle">
            <input type="checkbox" id="darkToggle">
            <span class="slider"></span>
        </label>
    </div>
    <div class="toggle-row">
        <label for="cleanToggle">Clean UI</label>
        <label class="toggle">
            <input type="checkbox" id="cleanToggle">
            <span class="slider"></span>
        </label>
    </div>
    <a class="options-link" id="openOptions">Customize Shortcuts</a>
    <script src="popup.js"></script>
</body>
</html>
